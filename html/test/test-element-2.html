    <body>
        
        <script>
            const map1 = new Map();

map1.set('VMEEF', -20);
map1.set('VCBF-BCF', -10);

// Expected output: 2
storeDataInLocalStorage("CONSTANT_INFER_LASTED_IMPACT_OF_PREVIOUS_DAY2024-11-15",map1);
console.log(retrieveDataFromLocalStorage("CONSTANT_INFER_LASTED_IMPACT_OF_PREVIOUS_DAY2024-11-15"));
console.log(localStorage.hasOwnProperty("CONSTANT_INFER_LASTED_IMPACT_OF_PREVIOUS_DAY2024-11-1511"));
// Store data in local storage
function storeDataInLocalStorage(key, value) {
    localStorage.setItem(key, JSON.stringify(value, replacer));
}
  
// Retrieve data from local storage
function retrieveDataFromLocalStorage(key) {
    const data = localStorage.getItem(key);
    console.log(key + data);
    return data ? JSON.parse(data, reviver) : null;
}

// custom replacer of JSON.stringify
function replacer(key, value) {
if(value instanceof Map) {
    return {
        dataType: 'Map',
        value: Array.from(value.entries()), // or with spread: value: [...value]
        };
    } else {
        return value;
    }
}

// custom reviver of JSON.parse
function reviver(key, value) {
    if(typeof value === 'object' && value !== null) {
        if (value.dataType === 'Map') {
        return new Map(value.value);
        }
    }
    return value;
}

        </script>
    </body>
