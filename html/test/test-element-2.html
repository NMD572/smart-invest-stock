<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invest Setting</title>

    <style>
        

    </style>
</head>
<body>
    <button id="buttonTest">Show notification</button>
    <script>
        document.getElementById("buttonTest").addEventListener("click", function(){
            sendLocalNotification('title','detail2',null,null,"testTag");
        });
        function sendLocalNotification(title, detailMessage, icon, externalInfor, distinctTag){
            Notification.requestPermission().then(permissionResult => {
                // permissionResult: ['granted', 'default', 'denied']
                console.log(permissionResult);
                if(permissionResult === 'granted'){
                    console.log("vào"); 
                    const notification = new Notification(title, {
                        body: detailMessage,
                        data: externalInfor,
                        icon: icon,
                        tag: distinctTag
                    });
                    console.log(notification);
                    
                    notification.addEventListener("error", exception =>{
                        // exception contain data (externalInfor)
                        console.error(exception);
                    });
                }
            })
        }
    </script>
</body>
</html>
