<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Detail CCQ</title>
    </head>
    <body>
        
        <script>
            let listResult=[];
            let generalArray=[];
            let firstArray=[1,2];
            let secondArray=[3,4];
            let thirdArray=[5,6];
            generalArray.push(firstArray);
            generalArray.push(secondArray);
            generalArray.push(thirdArray);
            calc(generalArray,0,1);
            console.log(listResult);
            function calc(generalArray, currentRow, previousMultipleResult){
                for(let number of generalArray[currentRow]){
                    let multipleResult = previousMultipleResult*number;
                    if(currentRow<generalArray.length - 1){
                        calc(generalArray,currentRow+1,multipleResult);
                    }else{
                        listResult.push(multipleResult);
                    }
                }
            }
        </script>
    </body>
</html>
