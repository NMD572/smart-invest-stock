<!DOCTYPE html>

<head>

<body onload="initScreen()">
    <div>
        <div>Ccq Classification</div>
        <button id="addClassificationButton">Add Classification</button>
        <table id="tableCqqClassification">
            <thead>
                <tr id="headerTableCqqClassification">
                    <td>CCQ Classification</td>
                    <td>List CCQ</td>
                    <td>Note</td>
                    <td>Compare CCQ</td>
                    <td>Delete</td>
                </tr>
            </thead>
            <tbody>
                <tr style="display: none;" id="rowIdStr0" data-ignore=true>
                    <td>
                        <input type="Text" class ="classification-name" placeholder="Classification">
                    </td>
                    <td class="ccq-for-classification-column">
                        <!--add class ccq-for-classification for format combobox-->
                        <select class="form-select-ccq-to-classify" data-placeholder="Choose CCQ To Classify" multiple>
                            <!-- <optgroup label="Genral Index" class="groupComboboxGeneralIndexRowData">
                                <option value="VNindex" title="Chỉ số VNindex">VNindex</option>
                            </optgroup> -->
                            <optgroup label="Stock CCQ" class="groupComboboxStockCcqRowData"></optgroup>
                            <optgroup label="Balanced CCQ" class="groupComboboxBalancedCcqRowData"></optgroup>
                            <optgroup label="Bond CCQ" class="groupComboboxBondCcqRowData"></optgroup>        
                        </select>
                    </td>
                    <td>
                        <input type="Text"  class ="classification-note" placeholder="Note">
                    </td>               
                    <td>
                        <button class="button-view-chart" data-rowId=0>
                            <i class="fa-solid fa-chart-line"></i>
                        </button>
                    </td>          
                    <td>
                        <button class="button-delete-classification" data-rowId=0>
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>

                    </td>
                    <td>
